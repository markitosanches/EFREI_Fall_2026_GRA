<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Props</title>
    <style>
        input{
            display: block;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div id="app">
        <login-form/>

    </div>

    <script src="https://unpkg.com/vue@3"></script>
    <script>
        let app = Vue.createApp({

        })
        app.component('login-form',{
            template:`
            <h1>{{title}}</h1>
            <form @submit.prevent="handleSubmit">
                <custom-input v-bind:label="labelUsername" :type="typeEmail" v-model="username"/>
                <custom-input :label="labelPassword" :type="typePassword" v-model="password"/>
                <custom-input :label="labelBirthday" :type="typeDate" v-model="birthday"/>
                <button>Login</button>
            </form>
            `,
            data(){
                return{
                    title: "Login Form",
                    labelUsername: "Username",
                    labelPassword: "Password",
                    labelBirthday: "Birthday",
                    typeEmail: "email",
                    typePassword: "password",
                    typeDate: "date",
                    username: null,
                    password: null,
                    birthday: null,
                }
            },
            methods:{
                handleSubmit(){
                    console.log(this.username, this.password)
                }
            }
        })
        app.component('custom-input',{
            template:`
                <label>{{label}}
                    <input :type="type" v-model="inputValue">
                </label>
            `,
            props:['label', 'type', 'modelValue'],
            computed:{
                inputValue:{
                    get(){
                        return this.modelValue
                    },
                    set(value){
                        this.$emit('update:modelValue', value)
                    }
                }
            }
        })
        app.mount("#app")
    </script>
</body>
</html>
