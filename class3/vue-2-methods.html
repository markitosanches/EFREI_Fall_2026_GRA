<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods</title>
    <style>
        .box{
            background-color: blue;
            width: 200px;
            height: 200px;
        }

        [v-cloak]{
            display: none;
        }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        {{ greeting }}
        <br>
        <input type="text" v-model="greeting" v-on:keyup.enter="greet">
        <hr>
        <!-- <div class="box" v-show="isVisible"></div> -->
        <div class="box" v-if="isVisible"></div>
        <hr>
        <!-- <button v-on:click="toggleBox">Toggle</button> -->
        <button @click="toggleBox">Toggle</button>

    </div>
    
    <script src="https://unpkg.com/vue@3"></script>
    <script>
        let app = Vue.createApp({
            data: function(){
                return{
                    greeting: "Hello",
                    isVisible: true,
                }
            },
            methods:{
                toggleBox(){
                this.isVisible = !this.isVisible
                },
                greet(){
                    console.log(this.greeting)
                }
            }
        })
        app.mount("#app")
    </script>
</body>
</html>
